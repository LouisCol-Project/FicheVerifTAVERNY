<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FPTGP – CIS Taverny</title>

  <link rel="shortcut icon" href="images/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-image">

  <div class="app-bg"></div>

  <header>
    <img src="images/logo.png" class="logoHeader" onclick="location.href='index.html'">
    <h1>Vérifications FPTGP</h1>
    <div class="headerRight">
      <div id="date"></div>
    </div>
  </header>

  <main>

    <div id="container"></div>

    <div class="comment-section">
  <label for="commentaire"><strong>Commentaire :</strong></label>
  <textarea
    id="commentaire"
    rows="4"
    placeholder="Saisir un commentaire..."
  ></textarea>
</div>

<button class="btn" onclick="saveAndReturn()">
  Enregistrer
</button>

  </main>

  <script>
    document.getElementById('date').textContent =
      new Date().toLocaleDateString('fr-FR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
  </script>

  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDocs,
  query,
  orderBy,
  limit,
  where,
  collection,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD14dNcDQW4SygSlo8YC8bJWisLYOh0Es",
  authDomain: "veriftav.firebaseapp.com",
  projectId: "veriftav",
  storageBucket: "veriftav.firebasestorage.app",
  messagingSenderId: "401217101102",
  appId: "1:401217101102:web:dd375734d4f0464c146ebf",
  measurementId: "G-KVSC8V8M1B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getData() {
  const inputs = document.querySelectorAll("input");
  const data = {};

  inputs.forEach(i => {
    if (i.type === "checkbox") {
      data[i.id] = i.checked;
    }

    if (i.type === "number") {
      data[i.id] = i.value === "" ? null : Number(i.value);
    }
  });

  return data;
}

function formatDate(raw) {
  let date;

  if (!raw) date = new Date();
  else if (raw.toDate) date = raw.toDate();
  else date = new Date(raw);

  if (isNaN(date.getTime())) date = new Date();

  return date.toLocaleDateString("fr-FR");
}

function highlightMissing(data, lastInfo = null) {

  document.querySelectorAll(".check-item").forEach(el => {
    el.classList.remove("missing");

    const badge = el.querySelector(".missing-badge");
    const warn = el.querySelector(".missing-text");

    if (badge) badge.style.display = "none";
    if (warn) warn.style.display = "none";
  });

  const date = formatDate(lastInfo?.date);
  const nom = lastInfo?.verificateur || "Inconnu";

  for (const [id, checked] of Object.entries(data)) {

    if (checked === false) {
      const input = document.getElementById(id);
      if (!input) continue;

      const wrapper = input.closest(".check-item");

      if (wrapper) {
        wrapper.classList.add("missing");

        const badge = wrapper.querySelector(".missing-badge");
        const warn = wrapper.querySelector(".missing-text");

        if (badge) badge.style.display = "flex";

        if (warn) {
          warn.textContent =
            `Matériel manquant constaté par ${nom} le ${date}`;
          warn.style.display = "inline";
        }
      }
    }
  }
}

async function saveCheck() {
  const checkData = {};

  document
    .querySelectorAll("input[type=checkbox]")
    .forEach(input => {
      checkData[input.id] = input.checked;
    });

  const commentaire =
    document.getElementById("commentaire")?.value.trim() || "";

  try {
    const timestamp = new Date();
    const docId = "EQBAL FPTGP_" + timestamp.getTime();

    const nomVerificateur =
      localStorage.getItem("nomVerificateur") || "Inconnu";

    await setDoc(doc(db, "verifications", docId), {
      nomDoc: "EQBAL FPTGP",
      date: timestamp,
      verificateur: nomVerificateur,
      commentaire: commentaire,
      data: checkData
    });

    console.log("Enregistrement OK");

  } catch (e) {
    console.error("Erreur Firestore :", e);
    alert("Erreur lors de l'enregistrement");
  }
}

async function highlightLastMissing() {
  try {
    const q = query(
      collection(db, "verifications"),
      where("nomDoc", "==", "EQBAL FPTGP"),
      orderBy("date", "desc"),
      limit(1)
    );

    const snapshot = await getDocs(q);
    if (snapshot.empty) return;

    const docData = snapshot.docs[0].data();

    highlightMissing(docData.data, {
      date: docData.date,
      verificateur: docData.verificateur
    });

  } catch (e) {
    console.error(e);
  }
}

function makeId(sectionName, labelText) {
  return `${sectionName}_${labelText}`
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "_")
    .replace(/[^\w_]/g, "");
}

function createSectionImage(sectionName) {
  const normalize = (name) =>
    name
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "_")
      .replace(/[^\w_]/g, "");

  const img = document.createElement("img");
  img.src = `images/EQBALFPTGP/${normalize(sectionName)}.jpg`;
  img.alt = sectionName;
  img.onerror = () => img.remove();

  return img;
}

function createAriPressureField(sectionName, fieldset) {

  const label = document.createElement("div");
label.className = "ari-pressure-label";

const text = document.createElement("span");
text.textContent = "Pression de la bouteille de l'ARI :";

const input = document.createElement("input");
input.type = "number";
input.className = "ari-pressure";
input.inputMode = "numeric";
input.min = "0";
input.placeholder = "300";
input.required = true;
input.id = makeId(
  sectionName,
  "Pression de la bouteille de l'ARI"
);

const unit = document.createElement("span");
unit.textContent = "Bars";

label.appendChild(text);
label.appendChild(input);
label.appendChild(unit);

fieldset.appendChild(label);
}

async function loadStructure() {
  const snap = await getDoc(doc(db, "FICHEVerif", "EQBALFPTGP"));
  if (!snap.exists()) return;

  const data = snap.data();
  const container = document.getElementById("container");
  container.innerHTML = "";

  const sections = Object.entries(data)
    .map(([name, section]) => ({ name, ...section }))
    .filter(s => s.items)
    .sort((a, b) => a.order - b.order);

  for (const section of sections) {

    const fieldset = document.createElement("fieldset");

    const legend = document.createElement("legend");
    legend.textContent = section.name;
    fieldset.appendChild(legend);

    fieldset.appendChild(createSectionImage(section.name));

    const isRappel =
      section.order === 1 &&
      section.name.toUpperCase() === "RAPPEL";

    for (const [labelText, value] of Object.entries(section.items)) {

      if (isRappel) {
        const p = document.createElement("p");
        p.textContent = "📌 " + labelText;
        fieldset.appendChild(p);
        continue;
      }

      const label = document.createElement("label");
      label.classList.add("check-item");

      const input = document.createElement("input");
      input.type = "checkbox";
      input.id = makeId(section.name, labelText);
      input.checked = value === true;

      const text = document.createElement("span");
      text.textContent = labelText;

      const badge = document.createElement("div");
      badge.className = "missing-badge";
      badge.style.display = "none";

      const warn = document.createElement("span");
      warn.className = "missing-text";
      warn.style.display = "none";

      label.appendChild(input);
      label.appendChild(badge);
      label.appendChild(text);
      label.appendChild(warn);

      fieldset.appendChild(label);

      if (
        section.name === "CABINE ARRIERE" &&
        labelText.includes("ARI complet")
      ) {
        createAriPressureField(section.name, fieldset);
      }
    }

    container.appendChild(fieldset);
  }
}

window.saveAndReturn = async function () {

  const pressionInput = document.getElementById(
    makeId(
      "CABINE ARRIERE",
      "Pression de la bouteille de l'ARI"
    )
  );

  if (!pressionInput || pressionInput.value.trim() === "") {
    alert(
      "Veuillez renseigner la pression de la bouteille de l'ARI."
    );
    pressionInput?.focus();
    return;
  }

  const pression = Number(pressionInput.value);

  if (pression < 280) {
    alert(
      "La pression de la bouteille de l'ARI doit être comprise entre 280 et 300 Bars en dessous il faut changé sa bouteille."
    );
    pressionInput.focus();
    return;
  }

  await saveCheck();
  location.href = "index.html";
};

window.addEventListener("DOMContentLoaded", async () => {
  await loadStructure();
  await highlightLastMissing();
});

  </script>

</body>
</html>
