<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VTU – CIS Taverny</title>

  <link
    rel="shortcut icon"
    href="images/logo.png"
    type="image/x-icon"
  >

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <body class="bg-image">

</head>

<body>

  <!-- BACKGROUND -->
  <div class="app-bg"></div>

  <!-- HEADER -->
  <header>

    <!-- LOGO -->
    <img
      src="images/logo.png"
      alt="Logo CIS Taverny"
      class="logoHeader"
    >

    <!-- TITRE -->
    <h1>Vérifications VTU</h1>

    <!-- DATE -->
    <div class="headerRight">
      <div id="date"></div>
    </div>

  </header>

  <!-- MAIN -->
  <main>

    <div class="card">

      <h2 class="section-title">
        Choisissez un poste
      </h2>

      <!-- VEHICULES -->
      <div class="vehicules">

        <!-- CHEF VTU -->
        <button
          class="vehicule CAVTU"
          onclick="location.href='CAVTU.html'"
        >
          <i class="fa-solid fa-walkie-talkie"></i>

          <span>Chef VTU</span>
        </button>

        <!-- CONDUCTEUR VTU -->
        <button
          class="vehicule COVTU"
          onclick="location.href='COVTU.html'"
        >
          <i class="fas fa-car-side"></i>

          <span>Conducteur VTU</span>
        </button>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    CIS Taverny – Vérifications opérationnelles
  </footer>

  <!-- SCRIPT -->
  <script>

    // DATE DYNAMIQUE

    document.getElementById("date").textContent =
      new Date().toLocaleDateString(
        "fr-FR",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      );

  </script>

</body>
</html>
