<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CCFM – CIS Taverny</title>

<link rel="preconnect" href="https://crekdqowqtivflqhhxfc.supabase.co">
<link rel="preload" as="image" href="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png">
<link rel="preload" as="image" href="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/CCF.png">


  <link rel="shortcut icon" href="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png" />

  <!-- FONT AWESOME -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body class="bg-image ccf">

  <!-- BACKGROUND -->
  <div class="app-bg"></div>

  <!-- HEADER -->
  <header>

    <!-- LOGO -->
    <img
      src="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png"
      alt="Logo CIS Taverny"
      class="logoHeader"
     loading="eager" fetchpriority="high">

    <!-- TITRE -->
    <h1>Vérifications CCFM</h1>

    <!-- DATE -->
    <div class="headerRight">
      <div id="date"></div>
    </div>

  </header>

  <!-- MAIN -->
  <main>

    <div class="card">

      <h2 class="section-title">
        Choisissez un poste
      </h2>

      <!-- VEHICULES -->
      <div class="vehicules">

        <!-- CHEF D'AGRES -->
        <button
          class="vehicule CACCF"
          onclick="location.href='CACCF.html'"
        >
          <i class="fa-solid fa-walkie-talkie"></i>

          <span>Chef d'agrès</span>
        </button>

        <!-- CONDUCTEUR -->
        <button
          class="vehicule COCCF"
          onclick="location.href='COCCF.html'"
        >
          <i class="fas fa-car-side"></i>

          <span>Conducteur</span>
        </button>

        <!-- CHEF -->
        <button
          class="vehicule CBATCCF"
          onclick="location.href='CECCF.html'"
        >
          <i class="fas fa-fire-extinguisher"></i>

          <span>Equipier 1</span>
        </button>

        <!-- EQUIPIER -->
        <button
          class="vehicule EBATCCF"
          onclick="location.href='EQCCF.html'"
        >
          <i class="fas fa-fire-extinguisher"></i>

          <span>Equipier 2</span>
        </button>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    CIS Taverny – Vérifications opérationnelles
  </footer>

  <!-- SCRIPT -->
  <script>

    // DATE DYNAMIQUE

    document.getElementById("date").textContent =
      new Date().toLocaleDateString(
        "fr-FR",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      );

  </script>

</body>
</html>
