<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VSSUAP – CIS Taverny</title>

  <link
    rel="shortcut icon"
    href="images/logo.png"
    type="image/x-icon"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <link rel="stylesheet" href="style.css">
  <body class="bg-image">

</head>

<body>

  <!-- BACKGROUND -->
  <div class="app-bg"></div>

  <!-- HEADER -->
  <header>

    <img
      src="images/logo.png"
      alt="Logo CIS Taverny"
      class="logoHeader"
    >

    <h1>Vérifications VSSUAP</h1>

    <div class="headerRight">
      <div id="date"></div>
    </div>

  </header>

  <!-- MAIN -->
  <main>

    <!-- CARD -->
    <div class="card">

      <h2 class="section-title">
        Choisissez un poste
      </h2>

      <!-- GRID -->
      <div class="vehicules">

        <!-- CHEF -->
        <button
          class="vehicule CAVSSUAP"
          onclick="location.href='CAVSAV.html'"
        >
          <i class="fa-solid fa-walkie-talkie"></i>

          <span>Chef d'agrès</span>
        </button>

        <!-- CONDUCTEUR -->
        <button
          class="vehicule COVSSUAP"
          onclick="location.href='COVSAV.html'"
        >
          <i class="fas fa-car-side"></i>

          <span>Conducteur</span>
        </button>

        <!-- EQUIPIER -->
        <button
          class="vehicule EQVSSUAP"
          onclick="location.href='EQVSAV.html'"
        >
          <i class="fas fa-first-aid"></i>

          <span>Equipier</span>
        </button>

      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    CIS Taverny – Vérifications opérationnelles
  </footer>

  <!-- DATE -->
  <script>

    document.getElementById("date").textContent =
      new Date().toLocaleDateString(
        "fr-FR",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      );

  </script>

</body>
</html>
