<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CCFM – CIS Taverny</title>

<link rel="preconnect" href="https://crekdqowqtivflqhhxfc.supabase.co">
<link rel="preload" as="image" href="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png">
<link rel="preload" as="image" href="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/TAV.png">


  <link rel="shortcut icon" href="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

<style>
/* Images communes chargées depuis Supabase */
body {
  background:
    linear-gradient(rgba(255,255,255,.60), rgba(255,255,255,.70)),
    url("https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/TAV.png") center / cover fixed !important;
}

.app-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(rgba(255,255,255,.50), rgba(255,255,255,.65)),
    url("https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/TAV.png") center / cover no-repeat !important;
}
</style>

</head>

<body class="bg-image">

  <div class="app-bg"></div>

  <header>
    <img src="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png" class="logoHeader" onclick="location.href='AccVerif.html'" loading="eager" fetchpriority="high">
    <h1>Vérifications CCFM</h1>
    <div class="headerRight">
      <div id="date"></div>
    </div>
  </header>

  <main>
    <div id="container"></div>

    <div class="comment-section">
      <label for="commentaire"><strong>Commentaire :</strong></label>
      <textarea
        id="commentaire"
        rows="4"
        placeholder="Saisir un commentaire..."
      ></textarea>
    </div>

    <div class="photo-section">
      <label><strong>Photos :</strong></label>

      <video
        id="camera"
        autoplay
        playsinline
        style="display:none; width:100%; max-width:420px; border-radius:12px; margin:10px 0;"
      ></video>

      <canvas id="canvas" style="display:none;"></canvas>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin:10px 0;">
        <button type="button" class="btn" onclick="startCamera()">Ouvrir caméra</button>
        <button type="button" class="btn" onclick="takePhoto()">Prendre photo</button>
        <button type="button" class="btn" onclick="stopCamera()">Fermer caméra</button>
      </div>

      <div id="photoPreview" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>

    <button class="btn" onclick="saveAndReturn()">
      Enregistrer
    </button>
  </main>

  <script>
    document.getElementById('date').textContent =
      new Date().toLocaleDateString('fr-FR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
  </script>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDocs,
      query,
      orderBy,
      limit,
      where,
      collection,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    /* ================= FIREBASE ================= */

    const firebaseConfig = {
      apiKey: "AIzaSyD14dNcDQW4SygSlo8YC8bJWisLYOh0Es",
      authDomain: "veriftav.firebaseapp.com",
      projectId: "veriftav",
      storageBucket: "veriftav.firebasestorage.app",
      messagingSenderId: "401217101102",
      appId: "1:401217101102:web:dd375734d4f0464c146ebf",
      measurementId: "G-KVSC8V8M1B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ================= SUPABASE ================= */

    const supabaseUrl = "https://crekdqowqtivflqhhxfc.supabase.co";
    const supabaseAnonKey = "sb_publishable_556tCAQOJpCdKuBCM2lM7Q_962-59jD";
    const supabaseBucket = "photo_verif";

    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    /* ================= CAMERA ================= */

    let cameraStream = null;
    let photosToUpload = [];

    window.startCamera = async function () {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        const video = document.getElementById("camera");
        video.srcObject = cameraStream;
        video.style.display = "block";

      } catch (e) {
        console.error(e);
        alert("Impossible d'accéder à la caméra.");
      }
    };

    window.takePhoto = function () {
      const video = document.getElementById("camera");
      const canvas = document.getElementById("canvas");

      if (!cameraStream) {
        alert("Ouvre d'abord la caméra.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        if (!blob) return;

        photosToUpload.push(blob);

        const wrapper = document.createElement("div");
        wrapper.style.position = "relative";

        const img = document.createElement("img");
        img.src = URL.createObjectURL(blob);
        img.style.width = "120px";
        img.style.height = "120px";
        img.style.objectFit = "cover";
        img.style.borderRadius = "10px";

        wrapper.appendChild(img);
        document.getElementById("photoPreview").appendChild(wrapper);

      }, "image/jpeg", 0.85);
    };

    window.stopCamera = function () {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      document.getElementById("camera").style.display = "none";
    };

    async function uploadPhotos(docId) {
      for (let i = 0; i < photosToUpload.length; i++) {
        const file = photosToUpload[i];

        const filePath =
          `CO-CCFM/${docId}/photo_${i + 1}_${Date.now()}.jpg`;

        const { error } = await supabase.storage
          .from(supabaseBucket)
          .upload(filePath, file, {
            contentType: "image/jpeg",
            upsert: false
          });

        if (error) {
          console.error("Erreur upload Supabase :", error);
          alert("Erreur lors de l'envoi d'une photo vers Supabase.");
        }
      }
    }

    /* ================= SAFE DATE ================= */

    function formatDate(raw) {
      let date;

      if (!raw) date = new Date();
      else if (raw.toDate) date = raw.toDate();
      else date = new Date(raw);

      if (isNaN(date.getTime())) date = new Date();

      return date.toLocaleDateString("fr-FR");
    }

    /* ================= HIGHLIGHT ================= */

    function highlightMissing(data, lastInfo = null) {

      document.querySelectorAll(".check-item").forEach(el => {
        el.classList.remove("missing");

        const badge = el.querySelector(".missing-badge");
        const warn = el.querySelector(".missing-text");

        if (badge) badge.style.display = "none";
        if (warn) warn.style.display = "none";
      });

      const date = formatDate(lastInfo?.date);
      const nom = lastInfo?.verificateur || "Inconnu";

      for (const [id, checked] of Object.entries(data)) {

        if (!checked) {
          const input = document.getElementById(id);
          if (!input) continue;

          const wrapper = input.closest(".check-item");

          if (wrapper) {
            wrapper.classList.add("missing");

            const badge = wrapper.querySelector(".missing-badge");
            const warn = wrapper.querySelector(".missing-text");

            if (badge) badge.style.display = "flex";

            if (warn) {
              warn.textContent =
                `Matériel manquant constaté par ${nom} le ${date}`;
              warn.style.display = "inline";
            }
          }
        }
      }
    }

    /* ================= SAVE FIRESTORE + SUPABASE ================= */

    async function saveCheck() {
      const checkData = {};

      document
        .querySelectorAll("input[type=checkbox]")
        .forEach(input => {
          checkData[input.id] = input.checked;
        });

      const commentaire =
        document.getElementById("commentaire")?.value.trim() || "";

      try {
        const timestamp = new Date();
        const docId = "CO CCFM_" + timestamp.getTime();

        const nomVerificateur =
          localStorage.getItem("nomVerificateur") || "Inconnu";

        await setDoc(doc(db, "verifications", docId), {
          nomDoc: "CO CCFM",
          date: timestamp,
          verificateur: nomVerificateur,
          commentaire: commentaire,
          data: checkData
        });

        await uploadPhotos(docId);

        console.log("Checkbox Firestore OK + Photos Supabase OK");

      } catch (e) {
        console.error("Erreur enregistrement :", e);
        alert("Erreur lors de l'enregistrement");
        throw e;
      }
    }

    /* ================= LAST CHECK ================= */

    async function highlightLastMissing() {
      try {
        const q = query(
          collection(db, "verifications"),
          where("nomDoc", "==", "CO CCFM"),
          orderBy("date", "desc"),
          limit(1)
        );

        const snapshot = await getDocs(q);
        if (snapshot.empty) return;

        const docData = snapshot.docs[0].data();

        highlightMissing(docData.data, {
          date: docData.date,
          verificateur: docData.verificateur
        });

      } catch (e) {
        console.error(e);
      }
    }

    /* ================= STRUCTURE ================= */

    function makeId(sectionName, labelText) {
      return `${sectionName}_${labelText}`
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "_")
        .replace(/[^\w_]/g, "");
    }

    function createSectionImage(sectionName) {
  const normalize = (name) =>
    name
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "_")
      .replace(/[^\w_]/g, "");

  const supabaseUrl = "https://crekdqowqtivflqhhxfc.supabase.co";
  const supabaseBucket = "Photo_Engins";
  const filePath = `COCCFM/${normalize(sectionName)}.jpg`;

  const img = document.createElement("img");
  img.src = `${supabaseUrl}/storage/v1/object/public/${supabaseBucket}/${filePath}`;
  img.alt = sectionName;
  img.loading = "lazy";
  img.onerror = () => img.remove();

  return img;
}

    /* ================= LOAD ================= */

    async function loadStructure() {
      const snap = await getDoc(doc(db, "FICHEVerif", "COCCFM"));
      if (!snap.exists()) return;

      const data = snap.data();
      const container = document.getElementById("container");
      container.innerHTML = "";

      const sections = Object.entries(data)
        .map(([name, section]) => ({ name, ...section }))
        .filter(s => s.items)
        .sort((a, b) => a.order - b.order);

      for (const section of sections) {

        const fieldset = document.createElement("fieldset");

        const legend = document.createElement("legend");
        legend.textContent = section.name;
        fieldset.appendChild(legend);

        fieldset.appendChild(createSectionImage(section.name));

        const isSimpleList = section.order === 1;

        for (const [labelText, value] of Object.entries(section.items)) {

          if (isSimpleList) {
            const p = document.createElement("p");
            p.textContent = "📌 " + labelText;
            fieldset.appendChild(p);
            continue;
          }

          const label = document.createElement("label");
          label.classList.add("check-item");

          const input = document.createElement("input");
          input.type = "checkbox";
          input.id = makeId(section.name, labelText);
          input.checked = value === true;

          const text = document.createElement("span");
          text.textContent = labelText;

          const badge = document.createElement("div");
          badge.className = "missing-badge";
          badge.style.display = "none";

          const warn = document.createElement("span");
          warn.className = "missing-text";
          warn.style.display = "none";

          label.appendChild(input);
          label.appendChild(badge);
          label.appendChild(text);
          label.appendChild(warn);

          fieldset.appendChild(label);
        }

        container.appendChild(fieldset);
      }
    }

    /* ================= GLOBAL ================= */

    window.saveAndReturn = async function () {
      await saveCheck();
      stopCamera();
      location.href = "AccVerif.html";
    };

    
function uncheckAllBoxes(){
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.checked = false;
  });
}

/* ================= INIT ================= */

    window.addEventListener("DOMContentLoaded", async () => {
      await loadStructure();
  uncheckAllBoxes();
      await highlightLastMissing();
    });

  </script>

</body>
</html>
