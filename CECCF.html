<body class="bg-image">

  <div class="app-bg"></div>

  <header>
    <img src="https://crekdqowqtivflqhhxfc.supabase.co/storage/v1/object/public/Photo_Engins/logo.png" class="logoHeader" onclick="location.href='AccVerif.html'" loading="eager" fetchpriority="high">

  <!-- DATE -->

  <!-- FIREBASE -->
  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDocs,
  query,
  orderBy,
  limit,
  where,
  collection,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

/* ================= FIREBASE ================= */

const firebaseConfig = {
  apiKey: "AIzaSyD14dNcDQW4SygSlo8YC8bJWisLYOh0Es",
  authDomain: "veriftav.firebaseapp.com",
  projectId: "veriftav",
  storageBucket: "veriftav.firebasestorage.app",
  messagingSenderId: "401217101102",
  appId: "1:401217101102:web:dd375734d4f0464c146ebf",
  measurementId: "G-KVSC8V8M1B"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= DATA ================= */

function getData() {
  const inputs = document.querySelectorAll("input[type=checkbox]");
  const data = {};
  inputs.forEach(i => data[i.id] = i.checked);
  return data;
}

/* ================= SAFE DATE ================= */

function formatDate(raw) {
  let date;

  if (!raw) date = new Date();
  else if (raw.toDate) date = raw.toDate();
  else date = new Date(raw);

  if (isNaN(date.getTime())) date = new Date();

  return date.toLocaleDateString("fr-FR");
}

/* ================= HIGHLIGHT ================= */

function highlightMissing(data, lastInfo = null) {

  document.querySelectorAll(".check-item").forEach(el => {
    el.classList.remove("missing");

    const badge = el.querySelector(".missing-badge");
    const warn = el.querySelector(".missing-text");

    if (badge) badge.style.display = "none";
    if (warn) warn.style.display = "none";
  });

  const date = formatDate(lastInfo?.date);
  const nom = lastInfo?.verificateur || "Inconnu";

  for (const [id, checked] of Object.entries(data)) {

    if (!checked) {
      const input = document.getElementById(id);
      if (!input) continue;

      const wrapper = input.closest(".check-item");

      if (wrapper) {
        wrapper.classList.add("missing");

        const badge = wrapper.querySelector(".missing-badge");
        const warn = wrapper.querySelector(".missing-text");

        if (badge) badge.style.display = "flex";

        if (warn) {
          warn.textContent =
            `Matériel manquant constaté par ${nom} le ${date}`;
          warn.style.display = "inline";
        }
      }
    }
  }
}

/* ================= SAVE ================= */

async function saveCheck() {
  const checkData = {};

  document
    .querySelectorAll("input[type=checkbox]")
    .forEach(input => {
      checkData[input.id] = input.checked;
    });

  const commentaire =
    document.getElementById("commentaire")?.value.trim() || "";

  try {
    const timestamp = new Date();
    const docId = "EQ1 CCFM_" + timestamp.getTime();

    const nomVerificateur =
      localStorage.getItem("nomVerificateur") || "Inconnu";

    await setDoc(doc(db, "verifications", docId), {
      nomDoc: "EQ1 CCFM",
      date: timestamp,
      verificateur: nomVerificateur,
      commentaire: commentaire,
      data: checkData
    });

    console.log("Enregistrement OK");

  } catch (e) {
    console.error("Erreur Firestore :", e);
    alert("Erreur lors de l'enregistrement");
  }
}

/* ================= LAST CHECK ================= */

async function highlightLastMissing() {
  try {
    const q = query(
      collection(db, "verifications"),
      where("nomDoc", "==", "EQ1 CCFM"),
      orderBy("date", "desc"),
      limit(1)
    );

    const snapshot = await getDocs(q);
    if (snapshot.empty) return;

    const docData = snapshot.docs[0].data();

    highlightMissing(docData.data, {
      date: docData.date,
      verificateur: docData.verificateur
    });

  } catch (e) {
    console.error(e);
  }
}

/* ================= STRUCTURE ================= */

function makeId(sectionName, labelText) {
  return `${sectionName}_${labelText}`
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "_")
    .replace(/[^\w_]/g, "");
}

function createSectionImage(sectionName) {
  const normalize = (name) =>
    name
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, "_")
      .replace(/[^\w_]/g, "");

  const supabaseUrl = "https://crekdqowqtivflqhhxfc.supabase.co";
  const supabaseBucket = "Photo_Engins";
  const filePath = `EQ1CCFM/${normalize(sectionName)}.jpg`;

  const img = document.createElement("img");
  img.src = `${supabaseUrl}/storage/v1/object/public/${supabaseBucket}/${filePath}`;
  img.alt = sectionName;
  img.loading = "lazy";
  img.onerror = () => img.remove();

  return img;
}

/* ================= LOAD ================= */

async function loadStructure() {
  const snap = await getDoc(doc(db, "FICHEVerif", "EQ1CCFM"));
  if (!snap.exists()) return;

  const data = snap.data();
  const container = document.getElementById("container");
  container.innerHTML = "";

  const sections = Object.entries(data)
    .map(([name, section]) => ({ name, ...section }))
    .filter(s => s.items)
    .sort((a, b) => a.order - b.order);

  for (const section of sections) {

    const fieldset = document.createElement("fieldset");

    const legend = document.createElement("legend");
    legend.textContent = section.name;
    fieldset.appendChild(legend);

    fieldset.appendChild(createSectionImage(section.name));

    const isRappel =
      section.order === 1 &&
      section.name.toUpperCase() === "RAPPEL";

    for (const [labelText, value] of Object.entries(section.items)) {

      if (isRappel) {
        const p = document.createElement("p");
        p.textContent = "📌 " + labelText;
        fieldset.appendChild(p);
        continue;
      }

      const label = document.createElement("label");
      label.classList.add("check-item");

      const input = document.createElement("input");
      input.type = "checkbox";
      input.id = makeId(section.name, labelText);
      input.checked = value === true;

      const text = document.createElement("span");
      text.textContent = labelText;

      const badge = document.createElement("div");
      badge.className = "missing-badge";
      badge.style.display = "none";

      const warn = document.createElement("span");
      warn.className = "missing-text";
      warn.style.display = "none";

      label.appendChild(input);
      label.appendChild(badge);
      label.appendChild(text);
      label.appendChild(warn);

      fieldset.appendChild(label);

    }

    container.appendChild(fieldset);
  }
}

/* ================= GLOBAL ================= */

window.saveAndReturn = async function () {
  await saveCheck();
  location.href = "AccVerif.html";
};


function uncheckAllBoxes(){
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.checked = false;
  });
}

/* ================= INIT ================= */

window.addEventListener("DOMContentLoaded", async () => {
  await loadStructure();
  uncheckAllBoxes();
  await highlightLastMissing();
});

  </script>

</body>
